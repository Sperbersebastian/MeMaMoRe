name: CI
on: [push, pull_request]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Lint Python
        run: pip install black && black --check scripts
      - name: Lint YAML
        run: pip install yamllint && yamllint config || true
      - name: ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck && shellcheck bin/*.sh bin/modules/*.sh || true
