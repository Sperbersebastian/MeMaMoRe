global:
  threads: 8
  contig_min_len: 1000
  ani: 95
  cov: 85

modules:
  ingest:
    make_testsets: true
    test_fraction: 0.10
    test_seed: 42
  qc:
    fastp:
      length_required: 50
      qualified_quality_phred: 15
      unqualified_percent_limit: 40
  assembly:
    metaspades:
      only_assembler: false
      kmers: [21,33,55,77,99,127]
    qc:
      breadth_min: 0.8
      depth_min: 2.0
  plasmids:
    # union: every candidate of any predictor (default, previous behaviour)
    # min2 / min3: candidates confirmed by >= 2 / 3 predictors, i.e. covered over
    # >= consensus_min_overlap of their length by the other tools' candidates
    consensus: union
    consensus_min_overlap: 0.5