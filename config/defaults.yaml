global:
  threads: 8
  contig_min_len: 1000          # assembly filter, contig QC, gene calls (genes.faa)
  ani: 95
  cov: 85

modules:
  ingest:
    make_testsets: true
    test_fraction: 0.10
    test_seed: 42
  qc:
    # host read removal after fastp with Hostile: none (default) | human
    # (human = index human-t2t-hla, T2T-CHM13v2.0 + HLA; fetched into refdata/hostile)
    host_removal: none
    host_index: human-t2t-hla
    fastp:
      length_required: 50
      qualified_quality_phred: 15
      unqualified_percent_limit: 40
  assembly:
    metaspades:
      only_assembler: false
      kmers: [21,33,55,77,99,127]
    qc:
      breadth_min: 0.8
      depth_min: 2.0
  binning:
    min_contig_len: 1500        # MetaBAT2 (hard floor 1500) and Binny
    semibin2: true              # SemiBin2 as 4th binner (best effort, into MAGScoT)
    semibin2_environment: ""    # "" = self-supervised; or a pre-trained habitat (e.g. human_gut)
    # GUNC chimerism check after MAGScoT; gunc_pass feeds the MAG quality tier
    gunc: true
  plasmids:
    # union: every candidate of any predictor (default, previous behaviour)
    # min2 / min3: candidates confirmed by >= 2 / 3 predictors, i.e. covered over
    # >= consensus_min_overlap of their length by the other tools' candidates
    consensus: union
    consensus_min_overlap: 0.5
    plasmer: true               # Plasmer (needs >= 32 GB RAM, else skipped)
    plasmer_min_len: 500        # Plasmer -m
    min_len: 2000               # plasmid candidates entering union/clustering
    plasme_min_len: 0           # PLASMe post-filter (0 = off)
    hotspot_min_len: 1500       # HOTSPOT host prediction input
  genomad:
    # filters of geNomad end-to-end (plasmid, virus and typer runs)
    preset: default             # default | conservative | relaxed
    min_score: 0.7              # --min-score (geNomad default; ignored with a preset)
  viruses:
    min_len: 1000               # VirSorter2 --min-length, VIBRANT -l
    virsorter2_min_score: 0.5   # VirSorter2 --min-score (its default)
    vibrant_min_orfs: 4         # VIBRANT -o (its default, can only be increased)
    vibrant_virome: false       # VIBRANT -virome for virome (VLP) samples
  args:
    mge: true                   # ISEScan + IntegronFinder 2 for ARG context
    is_window: 5000             # bp: ARG counts as "near IS" within this distance
    mobileog: true              # mobileOG-db 2.0.1 (DIAMOND on genes.faa), MGE genes near ARGs
    mobileog_min_id: 90         # thresholds as in mobileOGs-pl
    mobileog_min_qcov: 90
    mobileog_evalue: 1e-20